name: "Release GitHub"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.1). Required when running manually."
        required: true
        default: ""

env:
  PLUGIN_NAME: obsidian-plugin-s3-link

permissions:
  contents: write

jobs:
  release-github:
    runs-on: ubuntu-latest
    name: GitHub Release
    steps:
      - name: "Release Tag"
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          npm ci
          npx tsc -noEmit -skipLibCheck
          node esbuild.config.mjs production
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json versions.json ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
      - name: "Create Release"
        run: |
          gh release create $RELEASE_TAG ${{ env.PLUGIN_NAME }}.zip main.js manifest.json versions.json --title $RELEASE_TAG --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
